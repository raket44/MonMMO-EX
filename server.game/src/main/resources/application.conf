server {
  host = "0.0.0.0"
  port = 7777
  checksumSize = 2
  rootKeyResource = "game.private.pem"
  rootKey = ${?PIRATED_GAME_PRIVATE_KEY}
  rootKeyFile = ${?PIRATED_GAME_PRIVATE_KEY_FILE}
  sessionSecret = "dev-only-secret-do-not-use-in-production"
  sessionSecret = ${?PIRATED_SESSION_SECRET}
  sessionTokenMaxAge = 5m
  sessionTokenMaxAge = ${?PIRATED_SESSION_TOKEN_MAX_AGE}
}

db {
  host = "localhost"
  host = ${?GAME_DB_HOST}
  port = 20021
  port = ${?GAME_DB_PORT}
  name = "pirated_game_db"
  name = ${?GAME_DB_NAME}
  user = "pirated_game_user"
  user = ${?GAME_DB_USER}
  password = "changeMe!"
  password = ${?GAME_DB_PASSWORD}
  poolSize = 4
  poolSize = ${?GAME_DB_POOL_SIZE}
  # Applies the dev seed data in db/dev, including the admin account. The gradle run task turns
  # this on, so a plain launch of a built distribution never seeds.
  seedDev = false
  seedDev = ${?GAME_DB_SEED_DEV}
}

# These tools are also protected by the character's DEVELOPER permission. A production launch
# gets no debug commands or script-priority changes unless this separate server gate is enabled.
developer {
  enabled = false
  enabled = ${?PIRATED_DEV_TOOLS}
  interpretedOverrides = []
  kotlinOverrides = []
  interpreterVerbose = false
  interpreterVerbose = ${?PIRATED_INTERPRETER_VERBOSE}
  # Enable only after the matching generated client content has been installed in the managed copy.
  expansionClientContent = false
  expansionClientContent = ${?PIRATED_EXPANSION_CLIENT_CONTENT}
}
