# The two Postgres databases on the VPS. Ports bind to loopback only: the game and login
# servers run on the same box, and nothing outside may reach Postgres.
name: pirated

services:
  login-db:
    image: postgres:18
    container_name: login-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOGIN_DB_NAME:-pirated_login_db}
      POSTGRES_USER: ${LOGIN_DB_USER:-pirated_login_user}
      POSTGRES_PASSWORD: ${LOGIN_DB_PASSWORD:?LOGIN_DB_PASSWORD is required}
    ports:
      - 127.0.0.1:${LOGIN_DB_PORT:-20011}:5432
    volumes:
      - login_db_data:/var/lib/postgresql
  game-db:
    image: postgres:18
    container_name: game-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GAME_DB_NAME:-pirated_game_db}
      POSTGRES_USER: ${GAME_DB_USER:-pirated_game_user}
      POSTGRES_PASSWORD: ${GAME_DB_PASSWORD:?GAME_DB_PASSWORD is required}
    ports:
      - 127.0.0.1:${GAME_DB_PORT:-20021}:5432
    volumes:
      - game_db_data:/var/lib/postgresql

volumes:
  login_db_data:
  game_db_data:
