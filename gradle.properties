org.gradle.caching=true
org.gradle.configuration-cache=true

# The default 384m metaspace is too small for a build that also runs KSP.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
# Build daemons held gigabytes while the servers and client ran on a 13 GB laptop and starved it
# (2026-09-06 hard reset); idle daemons leave after five minutes now.
org.gradle.daemon.idletimeout=300000
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m

group=de.fiereu.openmmo
# x-release-please-start-version
version=0.1.0
# x-release-please-end
